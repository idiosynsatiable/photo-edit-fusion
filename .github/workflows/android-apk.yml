name: Android APK

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: photo-edit-fusion-android-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify emulator acceleration
        run: |
          ls -l /dev/kvm
          sudo chmod a+rw /dev/kvm
          test -r /dev/kvm
          test -w /dev/kvm

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools emulator platforms;android-36 build-tools;36.0.0'

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify editor
        run: pnpm verify

      - name: Build web editor (offline-first)
        run: pnpm build
        env:
          # Blank by design: an Android APK must not depend on Railway being paid or online.
          VITE_API_BASE_URL: ''

      - name: Install browser test runtime
        run: pnpm exec playwright install chromium

      - name: Verify editing and offline recovery
        run: pnpm test:e2e && pnpm test:e2e:offline
        env:
          CI: 'true'

      - name: Generate Android project
        run: pnpm exec cap add android

      - name: Sync web assets and native plugins
        run: pnpm exec cap sync android

      - name: Verify offline OCR assets are bundled into Android web assets
        run: |
          test -s apps/web/dist/tesseract/worker.min.js
          test -s apps/web/dist/tesseract/lang/eng.traineddata
          test -s android/app/src/main/assets/public/tesseract/worker.min.js
          test -s android/app/src/main/assets/public/tesseract/lang/eng.traineddata

      - name: Set preview version
        run: |
          sed -i 's/versionCode 1/versionCode ${{ github.run_number }}/' android/app/build.gradle
          sed -i 's/versionName "1.0"/versionName "1.2.0-preview"/' android/app/build.gradle

      - name: Assemble debug APK
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: photo-edit-fusion-android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Verify APK metadata and signature
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging android/app/build/outputs/apk/debug/app-debug.apk | grep "package: name='com.idiosynsatiable.photoeditfusion'"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging android/app/build/outputs/apk/debug/app-debug.apk | grep "targetSdkVersion:'36'"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose android/app/build/outputs/apk/debug/app-debug.apk
          unzip -l android/app/build/outputs/apk/debug/app-debug.apk | grep 'assets/public/tesseract/worker.min.js'
          unzip -l android/app/build/outputs/apk/debug/app-debug.apk | grep 'assets/public/tesseract/lang/eng.traineddata'
          unzip -l android/app/build/outputs/apk/debug/app-debug.apk | grep 'assets/public/tesseract/core/manifest.json'
          unzip -l android/app/build/outputs/apk/debug/app-debug.apk | grep -E "assets/public/tesseract/core/[^ ]+\\.wasm$"

      - name: Android emulator install and launch smoke test
        timeout-minutes: 30
        uses: reactivecircus/android-emulator-runner@v2
        with:
          emulator-boot-timeout: 900
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          disable-linux-hw-accel: false
          emulator-options: -accel on -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none
          script: |
            timeout 60 adb wait-for-device
            timeout 120 adb install -r android/app/build/outputs/apk/debug/app-debug.apk
            timeout 60 adb shell am start -W -n com.idiosynsatiable.photoeditfusion/.MainActivity
            sleep 12
            timeout 30 adb shell pidof com.idiosynsatiable.photoeditfusion


  publish-preview:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: android-apk
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: photo-edit-fusion-android-debug-apk
          path: release
      - name: Publish verified Android preview
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp release/app-debug.apk release/Photo-Edit-Fusion-1.2.0-preview.apk
          cd release
          sha256sum Photo-Edit-Fusion-1.2.0-preview.apk > SHA256SUMS.txt
          cd ..
          gh release create "typography-scene-${{ github.run_number }}" release/Photo-Edit-Fusion-1.2.0-preview.apk release/SHA256SUMS.txt --target "$GITHUB_SHA" --prerelease --title "Photo Edit Fusion 1.2.0 Preview" --notes "Offline visual font fitting across 14 bundled Latin families and imported fonts, English OCR, editable text styling, reversible scene color matching, soft mask edges and print-size PNG/JPEG export. Includes undo and project recovery. Debug-signed preview; automated editor tests and emulator install/launch checked. Physical Samsung and real print proofing remain unverified. Font matches are approximations when the source face is absent; no forensic-undetectability guarantee."
          gh release view "typography-scene-${{ github.run_number }}" --json url --jq .url
