name: Signed Android App Bundle

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-aab:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;36.0.0'

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Build offline-first web editor
        run: pnpm build
        env:
          VITE_API_BASE_URL: ''

      - name: Generate Android project
        run: pnpm exec cap add android

      - name: Sync web assets and native plugins
        run: pnpm exec cap sync android

      - name: Configure protected release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "Required GitHub Actions secret is missing: $name" >&2
              exit 1
            fi
          done
          mkdir -p "$RUNNER_TEMP/android-signing"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/android-signing/upload-key.jks"
          test -s "$RUNNER_TEMP/android-signing/upload-key.jks"
          chmod 600 "$RUNNER_TEMP/android-signing/upload-key.jks"
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/build.gradle")
          s = p.read_text()
          marker = "    buildTypes {"
          if marker not in s:
              raise SystemExit("Unexpected generated Gradle file: buildTypes block not found")
          signing = """    signingConfigs {
                  release {
                      storeFile file(System.getenv("ANDROID_KEYSTORE_PATH"))
                      storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                      keyAlias System.getenv("ANDROID_KEY_ALIAS")
                      keyPassword System.getenv("ANDROID_KEY_PASSWORD")
                  }
              }

          """
          s = s.replace(marker, signing + marker, 1)
          release_marker = "        release {"
          if release_marker not in s:
              raise SystemExit("Unexpected generated Gradle file: release build type not found")
          s = s.replace(release_marker, release_marker + "\n            signingConfig signingConfigs.release", 1)
          p.write_text(s)
          PY
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/android-signing/upload-key.jks

      - name: Build signed release AAB
        working-directory: android
        run: ./gradlew --no-daemon bundleRelease
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/android-signing/upload-key.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Verify AAB signature and target SDK
        run: |
          set -euo pipefail
          AAB="android/app/build/outputs/bundle/release/app-release.aab"
          test -s "$AAB"
          jarsigner -verify -verbose -certs "$AAB" >/dev/null
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging android/app/build/outputs/apk/debug/app-debug.apk 2>/dev/null || true
          echo "Signed AAB verification passed."

      - name: Upload signed AAB
        uses: actions/upload-artifact@v4
        with:
          name: photo-edit-fusion-signed-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30

      - name: Remove signing material
        if: always()
        run: rm -rf "$RUNNER_TEMP/android-signing"
