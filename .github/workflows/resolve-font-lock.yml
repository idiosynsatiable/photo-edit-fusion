name: Resolve bundled font dependencies
on:
  push:
    branches: [feat/typography-compositing-20261125]
    paths: [apps/web/package.json, .github/workflows/resolve-font-lock.yml]
permissions:
  contents: write
jobs:
  resolve:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
      - run: pnpm install --lockfile-only --no-frozen-lockfile
      - name: Save resolved dependency lock
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git diff --cached --quiet || git commit -m "Resolve offline editor font dependencies"
          git push
