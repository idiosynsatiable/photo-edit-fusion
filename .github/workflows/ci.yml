name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: photo-edit-fusion-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Upload resolved dependency lockfile
        uses: actions/upload-artifact@v4
        with:
          name: photo-edit-fusion-pnpm-lockfile
          path: pnpm-lock.yaml
          if-no-files-found: error
          retention-days: 7

      - name: Type check
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Scan for secrets
        run: pnpm scan-secrets

      - name: Scan for placeholders
        run: pnpm scan-placeholders

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Install Playwright browsers
        run: pnpm exec playwright install chromium

      - name: E2E tests
        run: pnpm test:e2e
        env:
          CI: 'true'
          DEBUG: 'pw:webserver'

      - name: Production PWA offline reload test
        run: pnpm test:e2e:offline
        env:
          CI: 'true'

      - name: Record visual QA frames
        if: always()
        run: |
          node - <<'NODE'
          const fs = require('node:fs'), path = require('node:path');
          const names = new Set(['automatic-font-match.png','scene-color-match.png','editor-desktop.png','editor-mobile.png']);
          function walk(dir) { if (!fs.existsSync(dir)) return; for (const entry of fs.readdirSync(dir,{withFileTypes:true})) { const file=path.join(dir,entry.name); if(entry.isDirectory())walk(file); else if(names.has(entry.name))console.log('PEF_QA_IMAGE '+entry.name+' '+fs.readFileSync(file).toString('base64')); } }
          walk('test-results');
          NODE

      - name: Upload Playwright diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-diagnostics
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
