name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: photo-edit-fusion-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: Install
        run: pnpm install --no-frozen-lockfile

      - name: Upload resolved dependency lockfile
        uses: actions/upload-artifact@v4
        with:
          name: photo-edit-fusion-pnpm-lockfile
          path: pnpm-lock.yaml
          if-no-files-found: error
          retention-days: 7

      - name: Type check
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Scan for secrets
        run: pnpm scan-secrets

      - name: Scan for placeholders
        run: pnpm scan-placeholders

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Install Playwright browsers
        run: pnpm exec playwright install chromium

      - name: E2E tests
        run: pnpm test:e2e
        env:
          CI: 'true'
          DEBUG: 'pw:webserver'

      - name: Production PWA offline reload test
        run: pnpm test:e2e:offline
        env:
          CI: 'true'

      - name: Upload Playwright diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-diagnostics
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
