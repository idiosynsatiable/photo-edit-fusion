name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: photo-edit-fusion-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: Install
        run: pnpm install --no-frozen-lockfile

      - name: Commit refreshed pnpm lockfile for same-repository PRs
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          if git ls-files --error-unmatch pnpm-lock.yaml >/dev/null 2>&1 && git diff --quiet -- pnpm-lock.yaml; then
            echo "pnpm lockfile is already synchronized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          if git diff --cached --quiet; then
            echo "no lockfile changes to commit"
            exit 0
          fi
          git commit -m "chore: add resolved pnpm lockfile for Capacitor 8"
          git fetch origin "$GITHUB_HEAD_REF"
          git rebase "origin/$GITHUB_HEAD_REF"
          git push origin "HEAD:${GITHUB_HEAD_REF}"

      - name: Upload resolved dependency lockfile
        uses: actions/upload-artifact@v4
        with:
          name: photo-edit-fusion-pnpm-lockfile
          path: pnpm-lock.yaml
          if-no-files-found: error
          retention-days: 7

      - name: Type check
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Scan for secrets
        run: pnpm scan-secrets

      - name: Scan for placeholders
        run: pnpm scan-placeholders

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Install Playwright browsers
        run: pnpm exec playwright install chromium

      - name: E2E tests
        run: pnpm test:e2e
        env:
          CI: 'true'
          DEBUG: 'pw:webserver'

      - name: Production PWA offline reload test
        run: pnpm test:e2e:offline
        env:
          CI: 'true'

      - name: Upload Playwright diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-diagnostics
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
