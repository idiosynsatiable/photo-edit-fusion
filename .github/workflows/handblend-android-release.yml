name: Verify Handblend Android Billing

on:
  push:
    branches:
      - codex/handblend-v020-billing
    paths:
      - ".codex/handblend-ci/**"
      - ".github/workflows/handblend-android-release.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out build payload
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Restore Handblend source
        shell: bash
        run: |
          mkdir -p handblend-release
          cat .codex/handblend-ci/part-* | base64 --decode > handblend-release.tar.gz
          echo "4572b5a4335b075f0427c46fe173e2f56805a51e2ed2b3424f9791e9bff8745c  handblend-release.tar.gz" | sha256sum --check
          tar -xzf handblend-release.tar.gz -C handblend-release

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: handblend-release/package-lock.json

      - name: Install dependencies
        working-directory: handblend-release
        run: npm ci

      - name: Verify editor
        working-directory: handblend-release
        run: |
          npm run check
          npm test
          npm run build

      - name: Sync Capacitor Android
        working-directory: handblend-release
        run: npx cap sync android

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true

      - name: Compile and bundle Android release
        working-directory: handblend-release/android
        run: |
          chmod +x gradlew
          ./gradlew :app:compileReleaseJavaWithJavac bundleRelease --no-daemon --stacktrace

      - name: Verify bundle contents
        shell: bash
        run: |
          test -f handblend-release/android/app/build/outputs/bundle/release/app-release.aab
          unzip -l handblend-release/android/app/build/outputs/bundle/release/app-release.aab | grep -q "base/manifest/AndroidManifest.xml"
          sha256sum handblend-release/android/app/build/outputs/bundle/release/app-release.aab

      - name: Upload unsigned app bundle
        uses: actions/upload-artifact@v4
        with:
          name: handblend-studio-v0.2.0-unsigned-aab
          path: handblend-release/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 7
